<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Color Quiz RGBY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Il colore è caldo o freddo?</h1>
    
    <div id="colorDisplay"></div>

    <div class="buttons">
        <button onclick="saveChoice('Caldo')">Caldo</button>
        <button onclick="saveChoice('Freddo')">Freddo</button>
        <button onclick="saveChoice('Non lo so')">Non lo so</button>
    </div>

    <hr>
    <div style="text-align: center;">
        <button id="toggleHistoryBtn" onclick="toggleHistory()">Mostra Cronologia</button>
    </div>
    <div id="historySection">
        <ul id="historyList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
