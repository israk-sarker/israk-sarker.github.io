<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valorant Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Dashboard -->
  <div id="dashboard">
    <nav class="navbar">
      <div class="nav-content">
        <div class="nav-brand">VAL<span>TRACKER</span></div>
        <div class="nav-search-container">
          <select id="search-region" class="nav-region-select">
            <option value="eu" selected>EU</option>
            <option value="na">NA</option>
            <option value="ap">AP</option>
            <option value="kr">KR</option>
            <option value="latam">LATAM</option>
            <option value="br">BR</option>
          </select>
          <input type="text" id="search-input" placeholder="Name#Tag" autocomplete="off" class="nav-search-input" />
          <button id="search-btn" class="nav-search-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
        <div class="nav-player" id="nav-player">
          <!-- JS -->
        </div>
        <div class="nav-links">
          <a href="#overview" class="nav-link active" data-tab="overview">Overview</a>
          <a href="#performance" class="nav-link" data-tab="performance">Performance</a>
        </div>
      </div>
    </nav>
    
    <div id="search-error" class="error-msg"></div>

    <main id="tab-content" class="tab-content">
      <div class="empty-state">Search for a player to view stats.</div>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
